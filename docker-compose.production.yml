services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aegis", "-d", "aegis"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - aegis-db:/var/lib/postgresql/data

  aegis:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env.production
    environment:
      ZAP_URL: http://zap:8080
      # ZAP reaches the target only through the app's per-scan DNS-pinned egress proxy.
      ZAP_EGRESS_PROXY_HOST: aegis
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.wapiti
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 30s

  # OWASP ZAP is a REQUIRED engine of the full URL assessment (scan-coverage). Without it every
  # full assessment can only reach PARTIAL. Internal-only: no published ports, API key enforced.
  zap:
    image: ghcr.io/zaproxy/zaproxy:2.16.1
    restart: unless-stopped
    env_file: .env.production
    command: ["sh","-c","exec zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.disablekey=false -config api.key=\"$${ZAP_API_KEY}\" -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true"]
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:8080/JSON/core/view/version/?apikey=$${ZAP_API_KEY}\" >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 1.0
    volumes:
      - zap-data:/home/zap/.ZAP

  # TLS edge from the architecture (Caddy). Opt-in profile so an existing host-level Caddy is not
  # displaced unexpectedly: `docker compose -f docker-compose.production.yml --profile edge up -d caddy`.
  caddy:
    image: caddy:2.10.2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - aegis
    volumes:
      - ./deploy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  zap-data:
  caddy-data:
  caddy-config:
  aegis-db:
    name: aegisgrc-security_aegis-db
    external: true
